version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    labels:
      - enhancement
    groups:
      actions:
        patterns:
          - "*"
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: monthly
    labels:
      - enhancement
    groups:
      nuget:
        patterns:
          - "*"
    ignore:
      # Snek is an MSBuild task package, so it must compile against the oldest supported MSBuild
      # version to stay loadable in older SDKs. Newer versions break the tests as well.
      - dependency-name: "Microsoft.Build.*"
